<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>출근 플리</title></head>
<body style="font-family:sans-serif;text-align:center;padding:48px 16px;background:#111;color:#eee">
<p>유튜브 앱 여는 중…</p>
<p><a id="a" style="display:inline-block;padding:14px 22px;background:#f00;color:#fff;border-radius:10px;text-decoration:none;font-size:18px">▶ 유튜브 앱에서 열기</a></p>
<script>
var q=new URLSearchParams(location.search),v=q.get('v')||'',l=q.get('l')||'';
var path='www.youtube.com/watch?v='+encodeURIComponent(v)+(l?'&list='+encodeURIComponent(l):'');
var web='https://'+path;
var ua=navigator.userAgent;
var href=/android/i.test(ua)?'intent://'+path+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(web)+';end'
 :(/iphone|ipad/i.test(ua)?'youtube://'+path:web);
document.getElementById('a').href=href;
location.href=href;
</script>
</body></html>
