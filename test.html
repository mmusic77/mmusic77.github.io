<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>앱 직행 시험</title></head>
<body style="font-family:sans-serif;text-align:center;padding:40px 16px;background:#111;color:#eee">
<p>유튜브 앱 직행 시험 — 두 버튼을 각각 눌러 보세요</p>
<p><a id="a" style="display:inline-block;margin:10px;padding:14px 22px;background:#f00;color:#fff;border-radius:10px;text-decoration:none;font-size:18px">A 방식</a></p>
<p><a id="b" style="display:inline-block;margin:10px;padding:14px 22px;background:#06c;color:#fff;border-radius:10px;text-decoration:none;font-size:18px">B 방식</a></p>
<script>
var ids=(new URLSearchParams(location.search).get('ids')||'').split(',').filter(Boolean);
function intent(path){var web='https://'+path;return /android/i.test(navigator.userAgent)?'intent://'+path+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(web)+';end':web;}
document.getElementById('a').href=intent('www.youtube.com/watch_videos?video_ids='+ids.join(','));
document.getElementById('b').href=intent('www.youtube.com/watch?v='+ids[0]+'&playlist='+ids.slice(1).join(','));
</script>
</body></html>
