<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크롬 원격 열기</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
a{display:block;margin:16px;padding:24px 28px;border-radius:14px;background:#1a73e8;color:#fff;font-size:21px;text-decoration:none}
p{color:#aaa;font-size:14px}
</style>
</head>
<body>
<div>
<a href="https://remotedesktop.google.com/access">크롬 원격 데스크톱 앱 열기</a>
<p>자동으로 안 열리면 위 버튼을 누르세요.</p>
</div>
<script>
// 수노 사람 확인창 알림용. 카톡 안 창에서는 크롬 원격 주소를 바깥(안드로이드)으로 넘겨 앱이 받게 한다.
// 크롬에서는 버튼(일반 링크)을 누르면 앱으로 열린다(11-11 시험 확인).
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent('https://remotedesktop.google.com/access');
}
</script>
</body>
</html>
